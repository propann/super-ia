name: ${COMPOSE_PROJECT_NAME:-super-ia}

x-browser-env: &browser-env
  PUID: ${BROWSER_PUID:-1000}
  PGID: ${BROWSER_PGID:-1000}
  TZ: ${TZ:-Europe/Paris}
  CUSTOM_USER: ${BROWSER_USER:?BROWSER_USER is required}
  PASSWORD: ${BROWSER_PASSWORD:?BROWSER_PASSWORD is required}
  HARDEN_DESKTOP: "true"
  SELKIES_AUDIO_ENABLED: "false"
  SELKIES_MICROPHONE_ENABLED: "false"
  SELKIES_MANUAL_WIDTH: ${BROWSER_WIDTH:-1280}
  SELKIES_MANUAL_HEIGHT: ${BROWSER_HEIGHT:-800}

x-browser-common: &browser-common
  image: ${BROWSER_IMAGE:-lscr.io/linuxserver/chromium:latest}
  restart: unless-stopped
  shm_size: "512mb"
  networks:
    - azoth-ai

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - azoth-ai

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    networks:
      - azoth-ai

  n8n:
    profiles: ["ai"]
    image: ${N8N_IMAGE:-n8nio/n8n:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_HOST: ${N8N_HOST:-127.0.0.1}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://127.0.0.1:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-Europe/Paris}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - azoth-ai

  litellm:
    profiles: ["ai"]
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-stable}
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      LITELLM_LOG: ${LITELLM_LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    volumes:
      - ../config/litellm.config.yaml:/app/config.yaml:ro
    networks:
      - azoth-ai

  dashboard:
    profiles: ["ai"]
    build:
      context: ../dashboard
    restart: unless-stopped
    environment:
      DASHBOARD_PORT: 8080
      DASHBOARD_CONFIG_DIR: /app/config
      DASHBOARD_DATA_DIR: /app/data
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ../config/connectors.json:/app/config/connectors.json:ro
      - ../config/browser-profiles.json:/app/config/browser-profiles.json:ro
      - ../config/agents.json:/app/config/agents.json:ro
      - ../config/projects.json:/app/config/projects.json:ro
      - ../data:/app/data:rw
    depends_on:
      n8n:
        condition: service_started
      litellm:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - azoth-ai

  browser-chatgpt:
    <<: *browser-common
    profiles: ["browser-chatgpt"]
    environment:
      <<: *browser-env
      CHROME_CLI: https://chatgpt.com/
      TITLE: "Azoth // ChatGPT"
    volumes:
      - browser_chatgpt_data:/config
    ports:
      - "127.0.0.1:${BROWSER_CHATGPT_PORT:-3011}:3001"

  browser-claude:
    <<: *browser-common
    profiles: ["browser-claude"]
    environment:
      <<: *browser-env
      CHROME_CLI: https://claude.ai/
      TITLE: "Azoth // Claude"
    volumes:
      - browser_claude_data:/config
    ports:
      - "127.0.0.1:${BROWSER_CLAUDE_PORT:-3012}:3001"

  browser-gemini:
    <<: *browser-common
    profiles: ["browser-gemini"]
    environment:
      <<: *browser-env
      CHROME_CLI: https://gemini.google.com/
      TITLE: "Azoth // Gemini"
    volumes:
      - browser_gemini_data:/config
    ports:
      - "127.0.0.1:${BROWSER_GEMINI_PORT:-3013}:3001"

  browser-deepseek:
    <<: *browser-common
    profiles: ["browser-deepseek"]
    environment:
      <<: *browser-env
      CHROME_CLI: https://chat.deepseek.com/
      TITLE: "Azoth // DeepSeek"
    volumes:
      - browser_deepseek_data:/config
    ports:
      - "127.0.0.1:${BROWSER_DEEPSEEK_PORT:-3014}:3001"

  browser-grok:
    <<: *browser-common
    profiles: ["browser-grok"]
    environment:
      <<: *browser-env
      CHROME_CLI: https://grok.com/
      TITLE: "Azoth // Grok"
    volumes:
      - browser_grok_data:/config
    ports:
      - "127.0.0.1:${BROWSER_GROK_PORT:-3015}:3001"

  browser-mistral:
    <<: *browser-common
    profiles: ["browser-mistral"]
    environment:
      <<: *browser-env
      CHROME_CLI: https://chat.mistral.ai/
      TITLE: "Azoth // Mistral"
    volumes:
      - browser_mistral_data:/config
    ports:
      - "127.0.0.1:${BROWSER_MISTRAL_PORT:-3016}:3001"

  browser-suno:
    <<: *browser-common
    profiles: ["browser-suno"]
    environment:
      <<: *browser-env
      CHROME_CLI: https://suno.com/
      TITLE: "Azoth // Suno"
    volumes:
      - browser_suno_data:/config
    ports:
      - "127.0.0.1:${BROWSER_SUNO_PORT:-3017}:3001"

networks:
  azoth-ai:
    external: true

volumes:
  postgres_data:
    name: azoth-ai-postgres
  qdrant_storage:
    name: azoth-ai-qdrant
  n8n_data:
    name: azoth-ai-n8n
  browser_chatgpt_data:
    name: azoth-ai-browser-chatgpt
  browser_claude_data:
    name: azoth-ai-browser-claude
  browser_gemini_data:
    name: azoth-ai-browser-gemini
  browser_deepseek_data:
    name: azoth-ai-browser-deepseek
  browser_grok_data:
    name: azoth-ai-browser-grok
  browser_mistral_data:
    name: azoth-ai-browser-mistral
  browser_suno_data:
    name: azoth-ai-browser-suno
