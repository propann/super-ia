name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
      - name: Build and test
        run: npm test
      - name: Validate installer syntax
        run: |
          bash -n install/pi/install.sh
          bash -n install/pi/preflight.sh
          bash -n install/pi/uninstall.sh
          bash -n install/tools/system-packages-debian.sh
          bash -n install/tools/bootstrap-user-tools.sh
          bash -n install/tools/verify-toolchain.sh
          bash -n install/tools/prepare-machine.sh
      - name: Run read-only Pi preflight
        run: sh install/pi/preflight.sh --strict
      - name: Reject privileged Pi installer commands
        run: |
          if grep -RInE '(^|[[:space:]])sudo([[:space:]]|$)' install/pi; then
            echo "The Pi package must not invoke sudo."
            exit 1
          fi
      - name: Reject remote pipe to shell installers
        run: |
          if grep -RInE '(curl|wget)[^|]*\|[[:space:]]*(ba)?sh' install; then
            echo "Remote content must never be piped directly into a shell."
            exit 1
          fi
      - name: Validate non-destructive preparation plans
        run: |
          bash install/tools/prepare-machine.sh --phase plan --profile full
          bash install/tools/system-packages-debian.sh --profile full --with-containers --dry-run
          bash install/tools/bootstrap-user-tools.sh --profile full --dry-run --no-modify-path
